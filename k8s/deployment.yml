apiVersion: apps/v1
kind: Deployment
metadata:
  name: telecom-churn-api
  namespace: telecom-churn
  labels:
    app: telecom-churn-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: telecom-churn-api
  template:
    metadata:
      labels:
        app: telecom-churn-api
    spec:
      containers:
        - name: telecom-churn-api
          image: YOUR_DOCKER_USERNAME/telecom-churn-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_DB
              value: telecom_mlops
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres123
            - name: POSTGRES_PORT
              value: "5432"
