name: MLOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: telecom_mlops
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d telecom_mlops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize test database
        run: |
          python - <<'PY'
          import psycopg2

          conn = psycopg2.connect(
              host="localhost",
              database="telecom_mlops",
              user="postgres",
              password="postgres123",
              port=5432,
          )
          cursor = conn.cursor()
          cursor.execute("""
              CREATE TABLE IF NOT EXISTS predictions_log2 (
                  id SERIAL PRIMARY KEY,
                  customerid VARCHAR(50),
                  tenure INTEGER,
                  monthly_charges DOUBLE PRECISION,
                  total_charges DOUBLE PRECISION,
                  contract VARCHAR(50),
                  prediction INTEGER,
                  created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
              );
          """)
          conn.commit()
          conn.close()
          PY

      - name: Run tests
        run: |
          python test_db.py

      - name: Build Docker image
        run: |
          docker build -t komalpanday360/telecom-churn-api:latest .

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push komalpanday360/telecom-churn-api:latest
